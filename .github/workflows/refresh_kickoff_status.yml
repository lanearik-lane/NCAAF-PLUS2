name: Refresh college player availability

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kickoff-status-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install refresh dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Refresh public reports
        run: python scripts/refresh_kickoff_status.py
      - name: Commit changed player statuses
        run: |
          if git diff --quiet -- data/kickoff_status_injuries.json; then
            echo "No published status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kickoff_status_injuries.json
          git commit -m "Refresh Kickoff Status player reports"
          git push
